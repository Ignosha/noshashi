[package]
name = "noshashi-academy"
version = "0.1.0"
description = "NOSHASHI Academy — learn NOSHASHI and the XRP Ledger"
edition = "2021"
rust-version = "1.77"

[lib]
name = "noshashi_academy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Deliberately small: a window, a link opener for noshashi.app, and saving
# a certificate to Downloads. No shell, filesystem, store, updater or HTTP
# plugin; the ledger is read from the webview under the CSP in tauri.conf.json.
tauri = { version = "2", features = [] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
