name: Updater manifest

# Writes latest.json, which installed copies read to find an update, from
# every signed bundle on a release (scripts/updater-manifest.mjs). Release
# calls it once all builds have finished; run it by hand to repair a
# release whose latest.json is missing a platform.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag; empty means v<version> from src-tauri/tauri.conf.json"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.24"
        required: true
        type: string

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write and attach latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "Release $TAG"
          work="$RUNNER_TEMP/updater"
          mkdir -p "$work/sigs"
          gh release view "$TAG" --json tagName,body,publishedAt,assets > "$work/release.json"
          gh release download "$TAG" --pattern '*.sig' --dir "$work/sigs"
          node scripts/updater-manifest.mjs "$work/release.json" "$work/sigs" "$work/latest.json"
          gh release upload "$TAG" "$work/latest.json" --clobber
          # Installed copies fetch releases/latest/download/latest.json, so the
          # current NOSHASHI release must be the repo's latest (an Academy
          # release published after it would otherwise take that place).
          if [ "$TAG" = "v$(node -p "require('./src-tauri/tauri.conf.json').version")" ]; then
            gh release edit "$TAG" --latest
          fi
