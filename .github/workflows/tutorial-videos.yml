name: Tutorial videos

# Records the /tutorials/ videos (scripts/tutorials/build.mjs): the real
# site, served locally, reading XRPL Mainnet live while Playwright drives
# it, narrated by Kokoro (Apache-2.0) run on the runner. Free: no service
# is called. Commits site/tutorials/videos to the branch that ran it.
# A tutorial whose live result does not load fails and is not committed.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Tutorial ids to (re)record, space-separated; empty records the missing ones"
        required: false
        default: ""
  push:
    # Never main: the build commits, and main only takes reviewed changes.
    branches-ignore: [main]
    paths:
      - scripts/tutorials/**
      - .github/workflows/tutorial-videos.yml

concurrency:
  group: tutorial-videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet kokoro-onnx numpy
      - name: Voice model
        run: |
          mkdir -p /tmp/kokoro
          R=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSL "$R/kokoro-v1.0.int8.onnx" -o /tmp/kokoro/kokoro-v1.0.int8.onnx
          curl -fsSL "$R/voices-v1.0.bin" -o /tmp/kokoro/voices-v1.0.bin
      - name: Record on Mainnet
        env:
          TTS_WORKERS: "4"
          IDS: ${{ inputs.ids }}
        run: |
          # A push records only the tutorials whose video is missing; run the
          # workflow by hand with ids to re-record existing ones.
          if [ -z "$IDS" ]; then
            IDS=$(node -e 'import("./scripts/tutorials/tutorials.mjs").then(m => console.log(m.TUTORIALS.map(t => t.id).filter(id => !require("fs").existsSync("site/tutorials/videos/" + id + ".mp4")).join(" ")))')
          fi
          echo "Recording: ${IDS:-nothing}"
          if [ -n "$IDS" ]; then node scripts/tutorials/build.mjs /tmp/kokoro $IDS; fi
      - name: Commit the videos
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/tutorials/videos
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Tutorial videos: record the narrated walkthroughs on Mainnet"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
