name: Learn videos

# Builds the narrated course videos (scripts/learn-videos/build.mjs) on a
# GitHub runner and commits them to the branch that ran it: MP4, captions
# (.vtt), poster and videos.json. The voice is Kokoro (Apache-2.0), run
# locally on the runner from the kokoro-onnx release files: free, and no
# service is called. Only videos whose files are missing are built, unless
# a list is given by hand.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Video ids to (re)build, space-separated; empty builds the missing ones"
        required: false
        default: ""
  push:
    # Never main: the build commits, and main only takes reviewed changes.
    branches-ignore: [main]
    paths:
      - scripts/learn-videos/**
      - .github/workflows/learn-videos.yml

concurrency:
  group: learn-videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet kokoro-onnx numpy
      - name: Voice model
        run: |
          mkdir -p /tmp/kokoro
          R=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSL "$R/kokoro-v1.0.int8.onnx" -o /tmp/kokoro/kokoro-v1.0.int8.onnx
          curl -fsSL "$R/voices-v1.0.bin" -o /tmp/kokoro/voices-v1.0.bin
      - name: Build the videos
        env:
          FFMPEG: ffmpeg
          TTS_WORKERS: "4"
          IDS: ${{ inputs.ids }}
        run: |
          if [ -z "$IDS" ]; then
            IDS=$(node -e 'import("./scripts/learn-videos/videos.mjs").then(m => console.log(m.VIDEOS.map(v => v.id).filter(id => !require("fs").existsSync("site/learn/videos/" + id + ".mp4")).join(" ")))')
          fi
          echo "Building: ${IDS:-nothing}"
          if [ -n "$IDS" ]; then node scripts/learn-videos/build.mjs /tmp/kokoro $IDS; fi
      - name: Commit the videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/learn/videos
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Learn videos: build the narrated course videos"
          git push
