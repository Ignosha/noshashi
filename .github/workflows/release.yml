name: Release

# Builds NOSHASHI for macOS, Windows and Linux.
#
# This lives in CI because it has to. Tauri links against each platform's
# native webview — WebView2 on Windows, WebKitGTK on Linux, WKWebView on
# macOS — and those toolchains cannot be cross-installed. Building all
# three from one machine is not a matter of adding a Rust target; it needs
# three machines, which is exactly what a CI matrix is.
#
# Trigger:  git tag v0.1.0 && git push --tags
# Output:   a draft GitHub Release with all three installers attached.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      edition:
        description: "Which edition to build"
        required: true
        default: "full"
        type: choice
        options: [full, demo]

jobs:
  # A release must not be able to ship a broken safety claim. Tagging
  # bypasses whatever ran on the branch, so the gate is re-run here and the
  # matrix depends on it — no installer is produced if a finding regressed.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK and its dependencies are the Linux webview. Without these
      # the Rust build fails at link time with missing pkg-config packages,
      # which reads as a Rust problem and is not one.
      #
      # This is Tauri 2's documented set for Ubuntu 22.04 and nothing else.
      # The v0.2.1 release failed on this step, which is why no .deb or
      # .AppImage shipped, and the list had drifted from that set twice: it
      # carried the legacy libappindicator3-dev alongside the ayatana package
      # that supersedes it, and it omitted libxdo-dev, which Tauri 2 needs.
      #
      # pkg-config runs afterwards so a missing webview names itself here
      # rather than surfacing later as an opaque Rust link error.
      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            build-essential \
            curl wget file
          pkg-config --modversion webkit2gtk-4.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "NOSHASHI ${{ github.ref_name }}"
          releaseBody: |
            Built from ${{ github.sha }} on ${{ matrix.platform }}.

            Verify your download before running it:

                shasum -a 256 <file>          # macOS / Linux
                certutil -hashfile <file> SHA256   # Windows

            The app also hashes its own running binary — Settings ›
            Binary integrity — so you can confirm nothing changed between
            this page and execution.

            These builds are **not code-signed or notarised**. macOS will
            warn about an unidentified developer; Windows SmartScreen will
            warn too. That is expected and worth saying plainly rather than
            letting it surprise you.
          releaseDraft: true
          prerelease: true

      # tauri-action attaches to the release, but a plain artefact makes the
      # binaries retrievable from a workflow_dispatch run with no tag.
      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: noshashi-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
