# Builds NOSHASHI Academy, the separate learning app, for each desktop
# platform, and runs its Rust tests.
#
# Runs on any push that changes the Academy or the course it teaches, and
# by hand. Installers are uploaded as workflow artifacts. Run it by hand
# with publish = true to attach them to a public GitHub Release tagged
# academy-v<version>, which the website's Academy page links to; that is a
# public release, so it is only ever done by hand.

name: Academy

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a public GitHub Release with the installers"
        type: boolean
        default: false
  push:
    paths:
      - "academy/**"
      - "src/lib/academy/**"
      - ".github/workflows/academy.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal DMG that runs on both Intel and Apple silicon Macs.
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            label: macos-universal
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            label: linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libgtk-3-dev patchelf build-essential file
          pkg-config --modversion webkit2gtk-4.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./academy/src-tauri -> target"
          key: academy-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Rust tests
        run: cargo test --lib --manifest-path academy/src-tauri/Cargo.toml

      - name: Build
        working-directory: academy
        run: npx tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: academy-${{ matrix.label }}
          path: |
            academy/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            academy/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            academy/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            academy/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            academy/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: academy-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./academy/src-tauri/tauri.conf.json').version")
          TAG="academy-v$VERSION"
          # Installer names contain a space ("NOSHASHI Academy_…"): give them
          # dashes for clean download links, and pass them as an array.
          mkdir upload
          find installers -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0 |
            while IFS= read -r -d '' f; do b=$(basename "$f"); cp "$f" "upload/${b// /-}"; done
          mapfile -t FILES < <(find upload -type f | sort)
          printf '%s\n' "${FILES[@]}"
          test "${#FILES[@]}" -ge 3
          gh release create "$TAG" --target "$GITHUB_SHA" --title "NOSHASHI Academy $VERSION" \
            --notes "NOSHASHI Academy, the free course for NOSHASHI and the XRP Ledger. These builds are not code-signed: macOS and Windows will warn about an unidentified developer." \
            "${FILES[@]}"
