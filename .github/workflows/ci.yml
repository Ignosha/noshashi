name: CI

# Typecheck and tests on every push and pull request.
#
# The tests here are not about coverage. They assert the specific sentences
# this product sells — that a tesSUCCESS payment delivering 0.4% is reported
# as a shortfall, that concentration is withheld when the holder walk is too
# thin to support it, that five signers where one carries quorum is reported
# as one. A refactor can invert any of those while the build stays green,
# which is precisely why the build is not the gate.
#
# Runs on one platform only. These are pure functions over hand-built
# reports — no DOM, no network, no ledger — so a second runner would buy
# nothing. Cross-platform coverage is the release workflow's job, and it
# only matters there because Tauri links native webviews.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: # so release.yml can gate on this

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One-time branch-scoped generated-asset reconciliation. This job never
  # touches main, deploys, publishes, or modifies application source.
  # Remove this job once its resulting generated assets are reviewed.
  reconcile_academy_continuity_branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/continuity-presign-gate-v1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Rebuild Academy generated assets
        run: npm run site:academy
      - name: Commit only generated Academy files if stale
        run: |
          set -euo pipefail
          git add -- site/academy/app
          if git diff --cached --quiet; then
            echo "Academy assets already match; no commit needed."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(academy): reconcile generated website assets on Continuity branch"
          git push origin HEAD:feat/continuity-presign-gate-v1

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      # NOSHREPAIR, the support staff console, has its own tsconfig.
      - name: Typecheck NOSHREPAIR
        run: npx tsc -p noshrepair --noEmit

      # NOSHASHI Academy, the separate learning app, has its own tsconfig.
      - name: Typecheck Academy
        run: npx tsc -p academy --noEmit

      # The Edge Functions are Deno, and nothing else in this pipeline
      # looks at them. tsconfig.json includes only `src`, so `npx tsc
      # --noEmit` above walks straight past supabase/functions — which
      # meant those three files were compiled by NOTHING between being
      # written and being deployed to production.
      #
      # That is not hypothetical. noshashi-verify shipped a call to
      # timingSafeEqual, a helper that exists in the Stripe webhook and
      # not in that file, and it reached main. Every request to the verb
      # it guards would have thrown a ReferenceError. `deno check` finds
      # it as TS2304 in seconds.
      #
      # Deno rather than tsc because Deno is what actually runs these
      # files: it resolves npm: and jsr: specifiers and knows the Deno
      # global, so there is no error output to filter and no risk of a
      # filter hiding a real fault.
      #
      # The check runs from supabase/functions, against the deno.json
      # there, and that is load-bearing rather than tidiness. Deno needs
      # nodeModulesDir to resolve the npm packages the jsr edge-runtime
      # types pull in transitively, and it creates that node_modules
      # beside its config. Run from the repository root it rewrites the
      # ROOT node_modules into Deno's layout and breaks the npm
      # toolchain sharing it — vitest then dies with
      # ERR_PACKAGE_PATH_NOT_EXPORTED, which is to say this step would
      # have taken the Tests step below red on its first run. Scoped to
      # that directory, the two dependency trees never meet.
      #
      # The glob is deliberate: a fourth function gets checked the day
      # it is added, with nobody having to remember this file.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6

      - name: Typecheck Edge Functions
        run: npm run check:functions

      # site/assets/garden-field.js is the bundled hero field, committed
      # like every site asset. A source change pushed without its bundle
      # would leave the site running the old field.
      - name: Garden field is rebuilt
        run: npm run check:garden

      # site/assets/intelligence.js is the homepage's live network and
      # evidence panel, bundled the same way.
      - name: Live intelligence is rebuilt
        run: npm run check:intelligence

      # templates/hero-bloom.svg is generated output that is committed.
      - name: Hero bloom is regenerated
        run: npm run check:bloom

      # Every brand file (favicon, site header mark, console mark, Tauri
      # icon source) is written by scripts/gen-brand.mjs from one geometry.
      - name: Brand mark is regenerated
        run: npm run check:brand

      # site/assets/noshx/ is NOSHX Core built for the website's support
      # console; the site deploys without packages, so the build is committed.
      - name: Website NOSHX is rebuilt
        run: npm run check:noshx-web

      # site/academy/app/ is the Academy built for the browser; committed for
      # the same reason.
      - name: Website Academy is rebuilt
        run: npm run check:academy-web

      # Preserve the rebuilt output for review rather than weakening the
      # generated-assets gate or automatically overwriting shipped files.
      - name: Record Academy generated-assets discrepancy
        if: failure()
        run: |
          mkdir -p academy-ci-diagnostic
          git status --short -- site/academy/app > academy-ci-diagnostic/status.txt
          git diff --stat -- site/academy/app > academy-ci-diagnostic/diff-stat.txt
          git diff -- site/academy/app/index.html site/academy/app/build-version.json site/academy/app/sw.js > academy-ci-diagnostic/entrypoints.patch
          cp -R site/academy/app academy-ci-diagnostic/rebuilt-app

      - name: Upload Academy rebuild evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-rebuild-diagnostic
          path: academy-ci-diagnostic/
          retention-days: 7
          if-no-files-found: ignore

      - name: Terminal account bundle is rebuilt
        run: npm run site:terminal-account && git diff --exit-code -- site/assets/terminal-account

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build public website
        run: npm run site:build

      - name: Build NOSHREPAIR
        run: npm run noshrepair:build

      - name: Audit production dependencies
        # Only what ships. The dev toolchain carries known vite/esbuild
        # dev-server advisories that cannot reach a built artefact, and
        # failing the build on them would train everyone to ignore this step.
        #
        # Kept visible without blocking the build: an advisory in a
        # transitive dependency is triaged, not allowed to wedge every PR.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Independent gate: the Academy generated-asset check can fail before the
  # monolithic verify job reaches Continuity. Do not skip or weaken Academy.
  continuity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck Continuity
        run: npm run continuity:check
      - name: Test Continuity
        run: npm run continuity:test
      - name: Build Continuity
        run: npm run continuity:build
      - name: Verify Continuity homepage integration
        run: npm run continuity:site:check
      - name: Verify isolated desktop configuration
        run: npm run continuity:desktop:check

  # Row level security and the database functions are the security boundary
  # for NOSHREPAIR (and for much else). tests/sql plays each role against
  # the real migrations on a throwaway Postgres that exists only on this
  # runner. Nothing here touches the production database.
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Start a scratch Postgres
        run: |
          set -euo pipefail
          docker run -d --name scratch -p 5432:5432 -e POSTGRES_PASSWORD=sql-test postgres:17 -c log_min_messages=fatal > /dev/null
          for _ in $(seq 1 60); do docker exec scratch pg_isready -U postgres -q && exit 0; sleep 1; done
          exit 1
      - name: Database tests
        run: scripts/test-sql.sh postgresql://postgres:sql-test@localhost:5432/postgres
      - name: Remove the scratch Postgres
        if: always()
        run: docker rm -f scratch > /dev/null 2>&1 || true
