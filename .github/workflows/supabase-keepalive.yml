# Free Supabase projects are paused after 7 days without activity. A pause does
# not merely slow the API down — it withdraws the project's DNS record, so
# `<ref>.supabase.co` stops resolving and every fetch in the shipped desktop app
# fails with a bare TypeError before it reaches the network. That is the exact
# failure this repo hit, and from the outside it is indistinguishable from a
# broken build to anyone holding an installer.
#
# One cheap read every three days counts as activity and keeps the timer from
# ever expiring. Two margins are deliberate: three days against a seven-day
# limit survives a couple of missed runs, and GitHub defers scheduled jobs under
# load, so a schedule this tight absorbs that drift without risking the window.
#
# The URL and key below are the publishable pair already committed in
# src/lib/supabase/client.ts. The publishable key grants nothing on its own —
# every table is behind row level security — so it is not a secret, and inlining
# it keeps this workflow working with no repository setup.

name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row through PostgREST
        env:
          SUPABASE_URL: https://xiurbiwuwcfowqnpmwki.supabase.co
          SUPABASE_KEY: sb_publishable_5Kk09a9QEwX1iALqmX-w8g_2fLY7tHO
        run: |
          set -euo pipefail

          # Deliberately not /auth/v1/health: that answers from GoTrue without
          # touching Postgres, and it is database activity that resets the
          # pause timer.
          #
          # Deliberately not the noshashi schema either. 20260828_harden_function_grants
          # leaves `anon` without USAGE on it, so an unauthenticated read there
          # returns 42501, "permission denied for schema noshashi" — correct
          # hardening, but useless as a ping. `public` stays readable by anon,
          # and RLS returns an empty array rather than an error, so 200 with no
          # rows is the expected success case. The round trip is the point, not
          # the rows.
          #
          # This depends on public.profiles existing. It is a leftover from an
          # earlier project on this Supabase instance; if you drop it, repoint
          # this at any surviving table in `public`, or the job starts failing —
          # loudly, via --fail-with-body, which is the intent. A silent
          # keepalive is worse than none.
          code=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1")

          echo "PostgREST returned ${code}"
