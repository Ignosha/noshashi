# Nginx configuration for IGNOSHASHI
# Install: sudo apt install nginx certbot python3-certbot-nginx
# Then: sudo cp nginx.conf /etc/nginx/sites-available/ignoshashi
#      sudo ln -s /etc/nginx/sites-available/ignoshashi /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#      sudo certbot --nginx -d yourdomain.com

upstream ignoshashi {
  server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
}

server {
  listen 80;
  server_name yourdomain.com www.yourdomain.com;
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl http2;
  server_name yourdomain.com www.yourdomain.com;

  # SSL (managed by certbot)
  # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Client body size (for video uploads)
  client_max_body_size 50M;

  # WebSocket support
  location / {
    proxy_pass http://ignoshashi;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Static assets caching
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    proxy_pass http://ignoshashi;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
