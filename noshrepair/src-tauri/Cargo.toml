[package]
name = "noshrepair"
version = "0.1.0"
description = "NOSHREPAIR — NOSHASHI's support console for staff"
edition = "2021"
rust-version = "1.77"

[lib]
name = "noshrepair_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Deliberately small: a window and nothing else. No shell, opener,
# filesystem, store, updater or HTTP plugin: NOSHREPAIR talks to NOSHASHI
# only through the webview, under the CSP in tauri.conf.json.
tauri = { version = "2", features = [] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
