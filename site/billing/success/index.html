<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="color-scheme" content="dark">
<title>NOSHASHI &middot; PAYMENT COMPLETE</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/flower-mark-180.png">
<style>
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#000;color:#F5F5F7;display:grid;place-items:center;padding:24px;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.frame{position:fixed;inset:18px;border:1px solid rgba(245,245,247,.10);pointer-events:none}
.tick{position:fixed;width:14px;height:14px;border-color:rgba(245,245,247,.55);pointer-events:none}
.tl{top:18px;left:18px;border-top:1px solid;border-left:1px solid}
.tr{top:18px;right:18px;border-top:1px solid;border-right:1px solid}
.bl{bottom:18px;left:18px;border-bottom:1px solid;border-left:1px solid}
.br{bottom:18px;right:18px;border-bottom:1px solid;border-right:1px solid}
main{max-width:460px;text-align:center;position:relative}
.status{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(245,245,247,.16);
 padding:5px 11px;margin:22px 0 20px;font-size:10px;letter-spacing:.24em;color:#8A8A99;font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:#2ED684}
h1{font-size:26px;line-height:1.2;letter-spacing:.09em;margin:0 0 14px;font-weight:800}
p{font-size:14px;line-height:1.65;color:#B9B9C6;margin:0 0 14px}
.note{font-size:12px;color:#6E6E7E;margin-top:22px}
.rule{height:1px;background:rgba(245,245,247,.12);margin:26px 0}
footer{margin-top:30px;font-size:11px;color:#55555F;letter-spacing:.06em}
a{color:#B9B9C6}
.lang-switch{margin-top:14px}
.lang-switch select{background:#000;color:#8A8A99;border:1px solid rgba(245,245,247,.16);font:inherit;font-size:11px;padding:5px 8px}
.lang-bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;
 padding:10px 16px;background:#0B0B0E;border-top:1px solid rgba(245,245,247,.12);font-size:12px;color:#B9B9C6}
.lang-bar[hidden]{display:none}.lang-bar .lang-note{color:#6E6E7E;font-size:11px}
.lang-bar button{background:transparent;color:#F5F5F7;border:1px solid rgba(245,245,247,.2);font:inherit;font-size:11px;padding:5px 10px;cursor:pointer}
</style></head><body>
<div class="frame"></div>
<span class="tick tl"></span><span class="tick tr"></span>
<span class="tick bl"></span><span class="tick br"></span>
<main>
  <img class="brand-mark" src="/assets/flower-mark-128.png" width="56" height="56" alt="" aria-hidden="true" decoding="async">
  <div class="status"><span class="dot"></span>NOSHASHI</div>
  <h1>PAYMENT COMPLETE</h1>
  <p>Your plan is active. Switch back to NOSHASHI &mdash; it picks up the new entitlement automatically when the window regains focus.</p>
  <div class="rule"></div>
  <p class="note">A receipt is on its way to your email from Stripe.</p>
  <footer><a href="/">Back to noshashi.app</a> &middot; You can close this tab.</footer>
</main><script src="/assets/i18n.js" defer></script>
<script src="/assets/garden-field.js" defer></script>
</body></html>
