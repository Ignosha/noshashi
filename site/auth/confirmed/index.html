<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="color-scheme" content="dark">
<title>NOSHASHI &middot; Email confirmed</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#000;color:#F5F5F7;display:grid;place-items:center;padding:24px;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.frame{position:fixed;inset:18px;border:1px solid rgba(245,245,247,.10);pointer-events:none}
.tick{position:fixed;width:14px;height:14px;border-color:rgba(245,245,247,.55);pointer-events:none}
.tl{top:18px;left:18px;border-top:1px solid;border-left:1px solid}
.tr{top:18px;right:18px;border-top:1px solid;border-right:1px solid}
.bl{bottom:18px;left:18px;border-bottom:1px solid;border-left:1px solid}
.br{bottom:18px;right:18px;border-bottom:1px solid;border-right:1px solid}
main{max-width:470px;text-align:center;position:relative}
.status{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(245,245,247,.16);
 padding:5px 11px;margin:22px 0 20px;font-size:10px;letter-spacing:.24em;color:#8A8A99;font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:#2ED684;transition:background .2s}
h1{font-size:26px;line-height:1.2;letter-spacing:.09em;margin:0 0 14px;font-weight:800}
p{font-size:14px;line-height:1.65;color:#B9B9C6;margin:0 0 14px}
.note{font-size:12px;color:#6E6E7E;margin-top:22px}
.rule{height:1px;background:rgba(245,245,247,.12);margin:26px 0}
footer{margin-top:30px;font-size:11px;color:#55555F;letter-spacing:.06em}
a{color:#B9B9C6}
</style></head><body>
<div class="frame"></div>
<span class="tick tl"></span><span class="tick tr"></span>
<span class="tick bl"></span><span class="tick br"></span>
<main>
  <svg viewBox="0 0 64 64" width="52" height="52" fill="none" aria-hidden="true">
    <path fill="#F5F5F7" fill-rule="evenodd" clip-rule="evenodd" d="M32 1.5c8.4 8.6 13.1 20.6 13.1 32.2V45.6H18.9V33.7C18.9 22.1 23.6 10.1 32 1.5Zm0 13.4-5.1 3v6l5.1 3 5.1-3v-6l-5.1-3Z"/>
    <path fill="#F5F5F7" d="M18.9 30.4v17.4H7.4c-1.2 0-1.8-1.4-1-2.3l12.5-15.1Z"/>
    <path fill="#F5F5F7" d="M45.1 30.4v17.4h11.5c1.2 0 1.8-1.4 1-2.3L45.1 30.4Z"/>
    <path fill="#F5F5F7" d="M22.9 45.6h18.2l-2.7 6.8c-.35 1-1.2 1.6-2.2 1.6h-8.4c-1 0-1.85-.6-2.2-1.6l-2.7-6.8Z"/>
    <path fill="#F5F5F7" d="M32 55.4c2.9 3.2 4.3 5.9 4.3 8.2 0 1-1.1 1.4-1.8.8-1.6-1.4-3.4-1.4-5 0-.7.6-1.8.2-1.8-.8 0-2.3 1.4-5 4.3-8.2Z"/>
  </svg>
  <div class="status"><span class="dot" id="dot"></span>NOSHASHI</div>
  <h1 id="title">EMAIL CONFIRMED</h1>
  <p id="blurb">Your address is verified. Open NOSHASHI and sign in — there is nothing else to do here.</p>
  <div class="rule"></div>
  <p class="note" id="note">This is a desktop application; the console does not run in a browser.</p>
  <footer><a href="/">noshashi.app</a> &middot; You can close this tab.</footer>
</main>
<script>
// Supabase reports the outcome in the URL fragment, which never leaves
// the browser. An expired or reused link is the common case and deserves
// a real explanation rather than a generic failure.
(function () {
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  var error = hash.get('error') || hash.get('error_code');
  if (!error) return;

  var code = hash.get('error_code') || '';
  var expired = /expired|otp_expired/i.test(code) || /expired/i.test(hash.get('error_description') || '');

  document.getElementById('dot').style.background = expired ? '#FFB020' : '#FF5448';
  document.getElementById('title').textContent = expired ? 'LINK EXPIRED' : 'CONFIRMATION FAILED';
  document.getElementById('blurb').textContent = expired
    ? 'This confirmation link has already been used or has timed out. Open NOSHASHI and request a new one — signing up again with the same address will resend it.'
    : (hash.get('error_description') || 'The link could not be verified.').replace(/\+/g, ' ');
  document.getElementById('note').textContent =
    'If your address was already confirmed, simply sign in — no new link is needed.';
})();
</script>
</body></html>
