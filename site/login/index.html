<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Sign in — NOSHASHI</title>
<meta name="description" content="Sign in to the NOSHASHI operations workspace.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body>
<main class="auth-shell">
  <a class="wordmark" href="/"><span class="wordmark-mark">N</span>NOSHASHI</a>
  <section class="auth-panel" aria-labelledby="auth-title">
    <p class="eyebrow">SECURE WORKSPACE ACCESS</p>
    <h1 id="auth-title">Sign in to the grid.</h1>
    <p class="lede">Review your workspace, evidence queue and operating preferences from one controlled surface.</p>
    <form id="authForm" class="auth-form">
      <label>Email<input id="email" type="email" autocomplete="email" required placeholder="operator@institution.com"></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="8+ characters"></label>
      <button class="primary-button" type="submit"><span id="submitLabel">SIGN IN</span></button>
    </form>
    <div class="auth-actions">
      <button class="text-button" id="modeToggle" type="button">Need an account? Create one</button>
      <button class="text-button" id="recovery" type="button">Send recovery link</button>
    </div>
    <p class="auth-status" id="status" role="status" aria-live="polite"></p>
    <p class="auth-foot">Authentication is handled by Supabase. NOSHASHI never receives your password.</p>
  </section>
</main>
<script>
const SUPABASE_URL = "https://xiurbiwuwcfowqnpmwki.supabase.co";
const SUPABASE_KEY = "sb_publishable_5Kk09a9QEwX1iALqmX-w8g_2fLY7tHO";
const form = document.getElementById("authForm");
const modeToggle = document.getElementById("modeToggle");
const recovery = document.getElementById("recovery");
const status = document.getElementById("status");
const submitLabel = document.getElementById("submitLabel");
let signUp = false;
function message(text, tone) { status.textContent = text; status.dataset.tone = tone || ""; }
async function auth(path, options) {
  const response = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
    ...options, headers: {"apikey": SUPABASE_KEY, "Content-Type": "application/json", ...(options.headers || {})}
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error_description || data.msg || data.message || "Authentication failed.");
  return data;
}
modeToggle.addEventListener("click", () => {
  signUp = !signUp;
  submitLabel.textContent = signUp ? "CREATE ACCOUNT" : "SIGN IN";
  modeToggle.textContent = signUp ? "Already have an account? Sign in" : "Need an account? Create one";
  message("");
});
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  message(signUp ? "Creating your workspace…" : "Verifying credentials…", "busy");
  try {
    const data = await auth(signUp ? "signup" : "token?grant_type=password", {
      method: "POST", body: JSON.stringify({email, password})
    });
    if (signUp && !data.access_token) {
      message("Check your email to confirm the account, then return here.", "good");
      return;
    }
    localStorage.setItem("noshashi-auth", JSON.stringify(data));
    location.href = "/dashboard/";
  } catch (error) { message(error.message, "bad"); }
});
recovery.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  if (!email) { message("Enter your email first so we know where to send the link.", "bad"); return; }
  message("Sending recovery link…", "busy");
  try {
    await auth("recover", {method: "POST", body: JSON.stringify({email, redirect_to: `${location.origin}/login/`})});
    message("Recovery link sent. Check your inbox.", "good");
  } catch (error) { message(error.message, "bad"); }
});
</script>
</body>
</html>
