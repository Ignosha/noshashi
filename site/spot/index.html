<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOSHASHI — Phantom Depth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0B0F14; --ink:#E8EDF4; --muted:#8B97A8; --faint:#5A6675;
    --rule:#232B36; --brand:#3A82F6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:24px; -webkit-font-smoothing:antialiased;
  }
  canvas{
    width:100%; max-width:1100px; aspect-ratio:16/9; height:auto;
    background:var(--ground); border:1px solid var(--rule); border-radius:10px;
    display:block;
  }
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{
    font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    background:transparent; color:var(--muted);
    border:1px solid var(--rule); border-radius:5px;
    padding:10px 16px; cursor:pointer;
  }
  button:hover{color:var(--ink);border-color:var(--faint)}
  button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  button.primary{background:var(--brand);color:#06121F;border-color:var(--brand);font-weight:500}
  button.primary:hover{filter:brightness(1.08)}
  button[disabled]{opacity:.4;cursor:default}
  .note{
    font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    font-size:11px;color:var(--faint);text-align:center;max-width:70ch;line-height:1.7;
  }
  .note b{color:var(--muted);font-weight:500}
  #status{color:var(--brand)}
</style>
</head>
<body>

<canvas id="c" width="1920" height="1080" aria-label="NOSHASHI commercial"></canvas>

<div class="bar">
  <button id="play" class="primary">Play</button>
  <button id="rec">Record &amp; download</button>
  <button id="mute" aria-pressed="false">Sound on</button>
  <span class="note" id="status"></span>
</div>

<p class="note">
  Recording captures the canvas in real time and saves a video file when it finishes.
  Chrome and Edge produce <b>.webm</b>; Safari produces <b>.mp4</b>.
  To convert a webm to mp4 later: <b>ffmpeg -i spot.webm -c:v libx264 -crf 18 -pix_fmt yuv420p spot.mp4</b>
</p>

<script>
(() => {
  const c = document.getElementById("c");
  const x = c.getContext("2d");
  const W = 1920, H = 1080;

  const INK="#E8EDF4", MUT="#8B97A8", FNT="#5A6675", RULE="#232B36",
        BRAND="#3A82F6", TELE="#00E0C6", NOGO="#FF5F6D", HOLD="#F5B942",
        GROUND="#0B0F14";

  /* Apple-ish motion: long, confident, no overshoot. Everything settles. */
  const easeOut  = t => 1 - Math.pow(1 - t, 4);
  const easeInOut= t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  const clamp01  = t => t < 0 ? 0 : t > 1 ? 1 : t;
  /** Normalised progress of [a,b] at time t. */
  const span = (t,a,b) => clamp01((t-a)/(b-a));

  const mono = (s,w=500) => `${w} ${s}px "IBM Plex Mono", ui-monospace, Menlo, monospace`;
  const disp = (s,w=700) => `${w} ${s}px "Space Grotesk", -apple-system, Helvetica, Arial, sans-serif`;

  function txt(str, px, py, font, fill, align="left", alpha=1, spacing=0){
    x.save(); x.globalAlpha=alpha; x.font=font; x.fillStyle=fill;
    x.textAlign = spacing ? "left" : align; x.textBaseline="alphabetic";
    if(spacing){
      const chars=[...str];
      let total=0; for(const ch of chars) total += x.measureText(ch).width + spacing;
      total -= spacing;
      let cx = align==="center" ? px-total/2 : align==="right" ? px-total : px;
      for(const ch of chars){ x.fillText(ch,cx,py); cx += x.measureText(ch).width + spacing; }
    } else x.fillText(str,px,py);
    x.restore();
  }

  /** Rise + fade, the only entrance used. Consistency reads as intent. */
  function rise(p){ return { a: p, dy: (1-easeOut(p)) * 26 }; }

  const fmt = n => Math.round(n).toLocaleString("en-US");

  /* ── Timeline ─────────────────────────────────────────────────── */
  const SCENES = [
    { d: 3.2, draw: t => {                       // 1 — the confident number
      const e = rise(span(t,0,.9));
      txt("USD / BITSTAMP · ORDER BOOK · 2026-08-28", 160, 430+e.dy, mono(22,400), FNT, "left", e.a, 6);
      const n = rise(span(t,.25,1.5));
      const shown = 1606485 * easeOut(span(t,.25,1.6));
      txt(fmt(shown), 160, 640+n.dy, mono(168), INK, "left", n.a);
      const u = rise(span(t,1.5,2.3));
      txt("This is the depth the book showed.", 160, 730+u.dy, disp(34,500), MUT, "left", u.a);
    }},

    { d: 3.6, draw: t => {                       // 2 — what was there
      const e = rise(span(t,0,.8));
      txt("WHAT WAS ACTUALLY THERE", 160, 430+e.dy, mono(22,400), NOGO, "left", e.a, 6);
      const n = rise(span(t,.2,1.4));
      const shown = 116107 * easeOut(span(t,.2,1.5));
      txt(fmt(shown), 160, 640+n.dy, mono(168), NOGO, "left", n.a);
      const u = rise(span(t,1.6,2.4));
      txt("The rest were offers whose owners", 160, 730+u.dy, disp(34,500), MUT, "left", u.a);
      txt("no longer held the asset.",          160, 776+u.dy, disp(34,500), MUT, "left", u.a);
    }},

    { d: 4.6, draw: t => {                       // 3 — the collapse
      const e = rise(span(t,0,.7));
      txt("THE GAP", 160, 300+e.dy, mono(22,400), FNT, "left", e.a, 6);

      const bw = 1600, bh = 26, bx = 160;
      // advertised
      const pa = easeInOut(span(t,.3,1.5));
      x.globalAlpha = rise(span(t,.2,.9)).a;
      txt("ADVERTISED", bx, 400, mono(20,400), FNT, "left", 1, 5);
      txt("1,606,485", bx+bw, 400, mono(20), MUT, "right");
      x.fillStyle="#1C2330"; x.fillRect(bx,420,bw,bh);
      x.fillStyle=MUT;       x.fillRect(bx,420,bw*pa,bh);

      // fillable
      const pb = easeInOut(span(t,1.1,2.6));
      txt("COULD FILL", bx, 520, mono(20,400), FNT, "left", 1, 5);
      txt("116,107", bx+bw, 520, mono(20), NOGO, "right");
      x.fillStyle="#1C2330"; x.fillRect(bx,540,bw,bh);
      x.fillStyle=NOGO;      x.fillRect(bx,540,bw*0.0723*pb,bh);
      x.globalAlpha = 1;

      const v = rise(span(t,2.5,3.6));
      txt("92.8% of it was not there.", 160, 760+v.dy, disp(88), INK, "left", v.a);
    }},

    { d: 5.0, draw: t => {                       // 4 — it is not only the book
      const e = rise(span(t,0,.7));
      txt("IT IS NOT ONLY THE BOOK", 160, 250+e.dy, mono(22,400), FNT, "left", e.a, 6);
      const rows = [
        ["999,332.87  →  3,958.64", "A payment that returned tesSUCCESS and delivered 0.4%.", NOGO],
        ["5,980 USDT · issuer owes nothing", "A token that has never been issued to anyone.", HOLD],
        ["5 signers · 1 can act alone", "Quorum counts signing weight, not people.", BRAND],
      ];
      rows.forEach((r,i) => {
        const p = rise(span(t, .5 + i*.55, 1.5 + i*.55));
        x.save(); x.globalAlpha = p.a;
        x.fillStyle = r[2];
        x.fillRect(160, 350 + i*160 + p.dy, 4, 96);
        x.restore();
        txt(r[0], 200, 400 + i*160 + p.dy, mono(46), INK, "left", p.a);
        txt(r[1], 200, 444 + i*160 + p.dy, disp(26,500), MUT, "left", p.a);
      });
    }},

    { d: 3.8, draw: t => {                       // 5 — the turn
      const e = rise(span(t,0,.8));
      txt("EVERY ONE OF THESE", 160, 400+e.dy, mono(22,400), TELE, "left", e.a, 6);
      const a = rise(span(t,.3,1.4));
      txt("The ledger publishes all of it.", 160, 560+a.dy, disp(78), INK, "left", a.a);
      const b = rise(span(t,.9,2.0));
      txt("Nothing shows it to you.",        160, 660+b.dy, disp(78), INK, "left", b.a);
    }},

    { d: 4.4, draw: t => {                       // 6 — the card
      const w = rise(span(t,0,1.2));
      txt("NOSHASHI", 160, 520+w.dy, disp(150), INK, "left", w.a, 22);
      const s = rise(span(t,.8,1.8));
      txt("Reads what the ledger actually says.", 160, 610+s.dy, disp(40,500), MUT, "left", s.a);

      const b = rise(span(t,1.5,2.5));
      x.save(); x.globalAlpha=b.a;
      x.fillStyle=BRAND; x.beginPath();
      x.roundRect(160, 690+b.dy, 520, 82, 8); x.fill();
      x.restore();
      txt("Check an address free", 200, 742+b.dy, disp(32,500), "#06121F", "left", b.a);

      const f = rise(span(t,2.1,3.0));
      txt("noshashi.app  ·  no account  ·  nothing is signed", 160, 850+f.dy, mono(24,400), FNT, "left", f.a, 3);
      txt("macOS · Windows · Linux", 160, 890+f.dy, mono(24,400), FNT, "left", f.a, 3);
    }},
  ];

  const TOTAL = SCENES.reduce((s,x)=>s+x.d, 0);
  const XF = 0.45;                              // crossfade, seconds

  function frame(time){
    x.fillStyle = GROUND; x.fillRect(0,0,W,H);

    // Hairline that grows across the whole piece — one continuous thread.
    x.strokeStyle = RULE; x.lineWidth = 2;
    x.beginPath(); x.moveTo(0, H-2); x.lineTo(W * clamp01(time/TOTAL), H-2); x.stroke();

    let start = 0;
    for (const s of SCENES){
      const local = time - start;
      const last = s === SCENES[SCENES.length - 1];
      if (local > -XF && (local < s.d || last)){
        /*
         * A true crossfade: the incoming scene rises over the XF window
         * BEFORE its own start, while the outgoing one is still falling.
         * Fading in from local 0 instead — which is the obvious way to
         * write this — leaves a gap where neither is on screen, and the
         * piece dips to black between every scene. Measured: the frame at
         * 11.0s was empty.
         */
        let a = 1;
        if (local < 0) a = easeInOut(clamp01((local + XF) / XF));
        // The closing card never fades out. A commercial ends on its card,
        // not on black — the last frame is the one people screenshot.
        const isLast = s === SCENES[SCENES.length - 1];
        if (!isLast && local > s.d - XF) {
          a = Math.min(a, easeInOut(clamp01((s.d - local) / XF)));
        }
        if (a > 0.001){
          x.save();
          x.globalAlpha = a;
          // A whisper of scale so cuts breathe. 0.6% — felt, not seen.
          const k = 1 + (1-a)*0.006;
          x.translate(W/2,H/2); x.scale(k,k); x.translate(-W/2,-H/2);
          s.draw(Math.max(0, local));
          x.restore();
        }
      }
      start += s.d;
    }
  }

  /* ── Sound ────────────────────────────────────────────────────────
   *
   * Every tone here is synthesised. Nothing is sampled and nothing is
   * fetched — partly because the CSP on the published page blocks external
   * media, and mostly because shipping someone else's recording inside a
   * commercial for a compliance product would be an odd way to behave.
   *
   * The palette is deliberately narrow: a low drone that holds the whole
   * piece, a soft mark on each cut, and one sound that carries meaning —
   * a falling tone under the collapse, so the drop is heard as well as
   * seen. No melody, no percussion, no swell at the end. It should sit
   * under the picture and be noticed only if removed.
   */
  let ac = null, master = null, monitor = null, recDest = null, drone = null;

  /*
   * The graph splits after the compressor:
   *
   *     sources → master → squeeze ─┬→ monitor → speakers
   *                                 └→ recDest → MediaRecorder
   *
   * Muting touches `monitor` only. Hanging mute off `master` would silence
   * the recorder too, so watching it quietly would hand back a silent file
   * — a trap worth designing out rather than documenting.
   */
  function audioInit(){
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.0001;
    const squeeze = ac.createDynamicsCompressor();
    squeeze.threshold.value = -18; squeeze.ratio.value = 6;
    master.connect(squeeze);

    monitor = ac.createGain();
    monitor.gain.value = 1;
    squeeze.connect(monitor);
    monitor.connect(ac.destination);

    recDest = ac.createMediaStreamDestination();
    squeeze.connect(recDest);
    return ac;
  }

  /** Two detuned voices and a slow filter — a bed, not a tune. */
  function startDrone(){
    if (!ac || drone) return;
    const g = ac.createGain();
    g.gain.value = 0.5;
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(220, ac.currentTime);
    lp.frequency.linearRampToValueAtTime(520, ac.currentTime + TOTAL * 0.75);
    lp.Q.value = 0.6;

    const voices = [55, 55.4, 82.5].map((f, i) => {
      const o = ac.createOscillator();
      o.type = i === 2 ? "sine" : "triangle";
      o.frequency.value = f;
      const vg = ac.createGain();
      vg.gain.value = i === 2 ? 0.16 : 0.30;
      o.connect(vg); vg.connect(lp);
      o.start();
      return o;
    });
    lp.connect(g); g.connect(master);
    drone = { voices, g };
  }

  function stopAudio(){
    if (!ac) return;
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setTargetAtTime(0.0001, ac.currentTime, 0.25);
    const d = drone;
    drone = null;
    if (d) setTimeout(() => d.voices.forEach(o => { try { o.stop(); } catch {} }), 1200);
  }

  /** A soft mark on a cut. Filtered noise, short, almost subliminal. */
  function mark(at, level = 0.14){
    if (!ac) return;
    const t = ac.currentTime + at;
    const len = Math.floor(ac.sampleRate * 0.22);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 320; bp.Q.value = 0.8;
    const g = ac.createGain();
    g.gain.setValueAtTime(level, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t + 0.26);
  }

  /** The one sound that means something: the depth falling away. */
  function fallingTone(at, dur = 1.5){
    if (!ac) return;
    const t = ac.currentTime + at;
    const o = ac.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(440, t);
    o.frequency.exponentialRampToValueAtTime(96, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.1);
  }

  /** A quiet, unresolved pair under the closing card. No triumphal chord. */
  function closeTone(at){
    if (!ac) return;
    const t = ac.currentTime + at;
    [146.83, 220].forEach((f, i) => {
      const o = ac.createOscillator();
      o.type = "sine"; o.frequency.value = f;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(i ? 0.06 : 0.09, t + 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3.4);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 3.6);
    });
  }

  /** Schedule the whole cue sheet against the scene boundaries. */
  function scheduleAudio(){
    if (!ac) return;
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setValueAtTime(0.0001, ac.currentTime);
    master.gain.exponentialRampToValueAtTime(0.55, ac.currentTime + 1.2);
    startDrone();

    let at = 0;
    SCENES.forEach((s, i) => {
      if (i > 0) mark(at, i === 2 ? 0.2 : 0.12);
      at += s.d;
    });
    // Scene 3 is the collapse; its bar animates from 1.1s into the scene.
    fallingTone(SCENES[0].d + SCENES[1].d + 1.1, 1.6);
    closeTone(TOTAL - SCENES[SCENES.length - 1].d + 0.4);
    // Ease the bed away just before the end so the card sits in near-silence.
    master.gain.setTargetAtTime(0.18, ac.currentTime + TOTAL - 3.2, 1.1);
  }

  /* ── Playback ─────────────────────────────────────────────────── */
  let raf = null, t0 = 0, recording = false;
  const playBtn = document.getElementById("play");
  const recBtn  = document.getElementById("rec");
  const status  = document.getElementById("status");
  const muteBtn = document.getElementById("mute");
  let muted = false;

  muteBtn.addEventListener("click", () => {
    muted = !muted;
    muteBtn.textContent = muted ? "Sound off" : "Sound on";
    muteBtn.setAttribute("aria-pressed", String(muted));
    // Speakers only — the recorder branch is untouched, so muting to watch
    // still records with sound.
    if (monitor) monitor.gain.setTargetAtTime(muted ? 0.0001 : 1, ac.currentTime, 0.12);
  });

  function run(onDone){
    cancelAnimationFrame(raf);
    t0 = performance.now();
    const tick = (now) => {
      const t = (now - t0)/1000;
      frame(Math.min(t, TOTAL));
      if (t < TOTAL) raf = requestAnimationFrame(tick);
      else { frame(TOTAL); onDone && onDone(); }
    };
    raf = requestAnimationFrame(tick);
  }

  playBtn.addEventListener("click", async () => {
    playBtn.disabled = true;
    audioInit();
    if (ac && ac.state === "suspended") await ac.resume();
    scheduleAudio();
    run(() => { stopAudio(); playBtn.disabled = false; });
  });

  recBtn.addEventListener("click", async () => {
    if (recording) return;
    recording = true;
    recBtn.disabled = playBtn.disabled = true;

    const types = [
      "video/mp4;codecs=avc1",
      "video/webm;codecs=vp9",
      "video/webm;codecs=vp8",
      "video/webm",
    ];
    const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    if (!mime){
      status.textContent = "This browser cannot record. Try Chrome or Safari.";
      recording = false; recBtn.disabled = playBtn.disabled = false;
      return;
    }

    // Video from the canvas, audio from the synth — merged into one
    // stream, or the saved file would be silent.
    audioInit();
    if (ac && ac.state === "suspended") await ac.resume();

    const stream = c.captureStream(60);
    if (recDest) {
      for (const track of recDest.stream.getAudioTracks()) stream.addTrack(track);
    }
    const rec = new MediaRecorder(stream, {
      mimeType: mime,
      videoBitsPerSecond: 12_000_000,
      audioBitsPerSecond: 192_000,
    });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
      const blob = new Blob(chunks, { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `noshashi-spot.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      status.textContent = `Saved noshashi-spot.${ext} — ${(blob.size/1e6).toFixed(1)} MB`;
      recording = false; recBtn.disabled = playBtn.disabled = false;
    };

    status.textContent = `Recording ${TOTAL.toFixed(1)}s with sound…`;
    scheduleAudio();
    rec.start();
    run(() => setTimeout(() => { stopAudio(); rec.stop(); }, 400));
  });

  /*
   * Poster frame. frame(0) is legitimately empty — nothing has risen yet —
   * so the canvas sat blank until someone pressed play. Hold 1.9s in,
   * where the first figure is fully settled.
   */
  const first = () => frame(1.9);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(first);
  else first();
})();
</script>
</body>
</html>
